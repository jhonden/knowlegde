[project]
name = "kb"
version = "0.1.0"
description = "Knowledge Base CLI Tool"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
kb = "kb.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["kb*"]
exclude = ["tests*", "deps*", "skills*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
